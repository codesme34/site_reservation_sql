<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Connectez-vous à votre compte Airlines Reservation pour accéder à vos réservations.">
    <meta name="robots" content="noindex, nofollow">
    <title>Connexion | Airlines Reservation</title>
    <link rel="canonical" href="{{ request.base_url }}">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>

</head>

<body>

    <div class="sticky-wrapper">
        <header>
            <!-- Logo à gauche -->
            <a href="/">
                <div class="logo">
                    <img src="static/assets/images/logo_avion.webp" alt="Logo">
                </div>
            </a>

            <!-- Milieu : Icône WhatsApp + textes -->
            <div class="center-part">
                <i class="fa-brands fa-whatsapp whatsapp-icon"></i>

                <div class="text-stack">
                    <span class="text-top">24h/7J</span>
                    <span class="text-bottom">Ligne direct : 01 64 12 32 58</span>
                </div>
            </div>

            <!-- Barre de recherche à droite -->
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="search" class="search-input" placeholder="Rechercher une ..." />
            </div>


            <div class="login_side">
                {% if current_user.is_authenticated %}
                <button class="boutton_connect">
                    <a href="/logout">
                        <i class="fa-solid fa-circle-user"></i>
                        <p>Déconnexion</p>
                </button>
                </a>
                {% else %}
                <button class="boutton_connect">
                    <a href="/login">
                        <i class="fa-solid fa-circle-user"></i>
                        <p>Mon compte</p>
                </button>
                </a>
                {% endif %}
            </div>
        </header>

        <main class="login-wrapper">
            <div class="login-header">
                <i class="fa-regular fa-circle-user login-avatar"></i>
                <h1>Connexion</h1>
                <p>Accédez à votre espace personnel</p>
            </div>

            <div class="login-card">
                <form action="/login" method="post" >
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="field-group">
                        <label for="email_user">Adresse e-mail</label>
                        <input type="email" id="email_user" name="email_user" placeholder="jean@exemple.com" required />
                    </div>
                    <div class="field-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required />
                    </div>
                     <div class="forgot-link">Mot de passe oublié ?</div>
                    <button type="submit">Se connecter</button>
                </form>
                <hr class="divider">
                <p class="login-footer">Pas encore de compte ? <a href="/create_login">Créer un compte</a></p>
            </div>
        </main>


</body>

</html>
