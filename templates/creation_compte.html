<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Créez votre compte Airlines Reservation gratuitement pour réserver vos hôtels et vols en quelques secondes.">
    <meta name="robots" content="noindex, nofollow">
    <title>Créer un compte | Airlines Reservation</title>
    <link rel="canonical" href="{{ request.base_url }}">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <div class="sticky-wrapper">
        <header>
            <!-- Logo à gauche -->
            <a href="/">
                <div class="logo">
                    <img src="static/assets/images/logo_avion.webp" alt="Logo">
                </div>
            </a>

            <!-- Milieu : Icône WhatsApp + textes -->
            <div class="center-part">
                <i class="fa-brands fa-whatsapp whatsapp-icon"></i>

                <div class="text-stack">
                    <span class="text-top">24h/7J</span>
                    <span class="text-bottom">Ligne direct : 01 64 12 32 58</span>
                </div>
            </div>

            <!-- Barre de recherche à droite -->
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="search" class="search-input" placeholder="Rechercher une ..." />
            </div>


            <div class="login_side">
                {% if current_user.is_authenticated %}
                <button class="boutton_connect">
                    <a href="/logout">
                        <i class="fa-solid fa-circle-user"></i>
                        <p>Déconnexion</p>
                </button>
                </a>
                {% else %}
                <button class="boutton_connect">
                    <a href="/login">
                        <i class="fa-solid fa-circle-user"></i>
                        <p>Mon compte</p>
                </button>
                </a>
                {% endif %}
            </div>
        </header>

        <main class="login-wrapper">
            <div class="login-header">
                <i class="fa-solid fa-user-plus login-avatar"></i>
                <h1>Créer un compte</h1>
                <p>Rejoignez-nous en quelques secondes</p>
            </div>

            <div class="login-card">
                <form method="post" action="/create_login">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="fields-row">
                        <div class="field-group">
                            <label for="prenom">Prénom</label>
                            <input type="text" id="prenom" name="prenom" placeholder="Jean" required />
                        </div>
                        <div class="field-group">
                            <label for="nom">Nom</label>
                            <input type="text" id="nom" name="nom" placeholder="Dupont" required />
                        </div>
                    </div>
                    <div class="field-group">
                        <label for="email">Adresse e-mail</label>
                        <input type="email" id="email" name="email" placeholder="jean@exemple.com" required />
                    </div>
                    <div class="field-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required />
                    </div>
                    <div class="field-group">
                        <label for="confirm_password">Confirmer le mot de passe</label>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required />
                    </div>
                    <button type="submit">Créer mon compte</button>
                </form>
                <hr class="divider">
                <p class="login-footer">Déjà un compte ? <a href="/login">Se connecter</a></p>
            </div>
        </main>



</body>

</html>
